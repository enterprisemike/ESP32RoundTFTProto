; OSPTEK ESP32-S3 Demo Dev Board + 1.51" 466x466 AMOLED (CO5300, QSPI)
; Board: ESP32-S3R8 (8MB octal PSRAM), 16MB flash, CH343P USB-UART

[env:osptek_s3_amoled]
; pioarduino platform: Arduino core 3.x (required by current Arduino_GFX)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1

; ESP32-S3R8: QIO flash + octal PSRAM, 16MB flash
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    ; Serial goes through UART0 -> CH343P USB-UART bridge
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0

monitor_speed = 115200
upload_speed = 921600
